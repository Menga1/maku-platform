# Keeps the hosted Streamlit app awake.
# Streamlit Community Cloud puts an app to sleep after a period without
# visitors; the mobile apps then show "No connection" (E-PROBE) until someone
# clicks "Yes, get this app back up!" in a browser. This job opens the app in
# a real browser every 15 minutes (GitHub often runs schedules late) and
# clicks that button if the app is asleep.
name: Keep MAKU awake

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2 >/dev/null
          # Use the Google Chrome preinstalled on the runner: no apt downloads,
          # which failed on 11 Nov when the Ubuntu mirrors were unreachable.
      - name: Visit the app and wake it if needed
        env:
          APP_URL: https://maku-platform-kn2dmt4u75pyb2ck5dtkbd.streamlit.app/
        run: |
          cat > ping.mjs <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ channel: "chrome" });
          const page = await browser.newPage();
          await page.goto(process.env.APP_URL, { waitUntil: "domcontentloaded", timeout: 60000 });
          await page.waitForTimeout(8000);
          const wake = page.getByRole("button", { name: /get this app back up/i });
          if (await wake.count()) {
            console.log("App was asleep - waking it");
            await wake.first().click();
          } else {
            console.log("App is awake");
          }
          // Streamlit renders inside an iframe on *.streamlit.app; look in every frame.
          // A cold start can take a few minutes: keep checking for up to 5.
          let ok = false;
          for (let i = 0; i < 30 && !ok; i++) {
            for (const f of page.frames()) {
              if (await f.getByText(/Secure access|Accès sécurisé/i).count().catch(() => 0)) ok = true;
            }
            if (!ok) await page.waitForTimeout(10000);
          }
          console.log(ok ? "Login page is showing" : "Login page not found after 5 minutes");
          await browser.close();
          // Do not fail the job (that would email on every slow start); the log says it.
          EOF
          node ping.mjs
