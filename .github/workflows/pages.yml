# Publishes the public legal pages (privacy policy, account deletion, support)
# from deploy/site/ to GitHub Pages:
#   https://menga1.github.io/maku-platform/privacy.html
#   https://menga1.github.io/maku-platform/delete-account.html
#   https://menga1.github.io/maku-platform/support.html
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
# The app stores require these URLs. The run fails while any [PLACEHOLDER]
# is still in the pages, so an unfinished policy is never published.
name: Legal pages

on:
  push:
    branches: [main]
    paths: ["deploy/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to publish unfinished pages
        run: |
          if grep -nE '\[[A-Z][A-Z ,.]+\]|Operator note' deploy/site/*.html; then
            echo "::error::Fill in every [PLACEHOLDER] and remove the operator note before publishing."
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: deploy/site

      - id: deployment
        uses: actions/deploy-pages@v5
