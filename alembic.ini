# Alembic configuration for MAKU. The database URL is NOT stored here:
# migrations/env.py reads DATABASE_URL (or MAKU_DATABASE_URL), falling back to
# the local SQLite file only outside strict production mode.
#   python scripts/init_db.py        # what the container runs at start-up
#   alembic upgrade head             # by hand
#   alembic current / alembic history
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
